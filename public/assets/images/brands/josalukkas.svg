    <circle cx="21" cy="14" r="2" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="26" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="900" fill="#022C22" letter-spacing="1.5">JOS ALUKKAS</text>
  <line x1="53" y1="32" x2="205" y2="32" stroke="url(#jaGold)" stroke-width="1"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#047857" letter-spacing="3.2">PURE GOLD. PURE TRUST.</text>
</svg>