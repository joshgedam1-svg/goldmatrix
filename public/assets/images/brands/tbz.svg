  <text x="52" y="26" font-family="'Cinzel', 'Times New Roman', serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="3">T B Z</text>
  <line x1="53" y1="32" x2="208" y2="32" stroke="url(#tbzGold)" stroke-width="1.2"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7.2" font-weight="800" fill="#92400E" letter-spacing="3.2">THE ORIGINAL SINCE 1864</text>
