<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="pngGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pngRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <!-- PNG Emblem -->
  <g transform="translate(6, 4)">
    <rect x="2" y="2" width="36" height="36" rx="18" fill="url(#pngRed)" stroke="url(#pngGold)" stroke-width="1.5"/>
    <text x="7" y="26" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="900" fill="url(#pngGold)">PNG</text>
  </g>
  <!-- Wordmark -->
  <text x="52" y="26" font-family="'Cinzel', 'Times New Roman', serif" font-size="20" font-weight="900" fill="#7F1D1D" letter-spacing="2">PNG JEWELLERS</text>
  <line x1="53" y1="32" x2="208" y2="32" stroke="url(#pngGold)" stroke-width="1"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#B45309" letter-spacing="3.5">PURITY IS OUR LEGACY • SINCE 1832</text>
</svg>
