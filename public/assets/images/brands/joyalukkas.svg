<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="jlRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="jlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Joyalukkas Circular Emblem -->
  <g transform="translate(6, 4)">
    <circle cx="21" cy="21" r="20" fill="url(#jlRed)"/>
    <circle cx="21" cy="21" r="17" fill="none" stroke="url(#jlGold)" stroke-width="1.5"/>
    <!-- Intertwined Wedding Rings / J Heart -->
    <circle cx="17" cy="20" r="7" fill="none" stroke="url(#jlGold)" stroke-width="1.8"/>
    <circle cx="25" cy="20" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="27" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="900" fill="#9F1239" letter-spacing="1">Joyalukkas</text>
  <line x1="53" y1="33" x2="208" y2="33" stroke="url(#jlGold)" stroke-width="1"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7" font-weight="700" fill="#D97706" letter-spacing="2.5">WORLD'S FAVOURITE JEWELLER</text>
</svg>
