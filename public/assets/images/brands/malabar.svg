<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="mgdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="mgdRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
  </defs>
  <!-- Malabar Signature Floral Rosette Emblem -->
  <g transform="translate(6, 4)">
    <!-- 8 Petals arranged radially -->
    <circle cx="21" cy="21" r="20" fill="url(#mgdRuby)"/>
    <g fill="url(#mgdGold)">
      <!-- Petal cluster -->
      <path d="M21 7 C23 12, 23 16, 21 19 C19 16, 19 12, 21 7 Z"/>
      <path d="M21 35 C23 30, 23 26, 21 23 C19 26, 19 30, 21 35 Z"/>
      <path d="M7 21 C12 23, 16 23, 19 21 C16 19, 12 19, 7 21 Z"/>
      <path d="M35 21 C30 23, 26 23, 23 21 C26 19, 30 19, 35 21 Z"/>
      <!-- Diagonal petals -->
      <path d="M11 11 C16 14, 18 17, 19 20 C17 18, 14 16, 11 11 Z"/>
      <path d="M31 11 C26 14, 24 17, 23 20 C25 18, 28 16, 31 11 Z"/>
      <path d="M11 31 C16 28, 18 25, 19 22 C17 24, 14 26, 11 31 Z"/>
      <path d="M31 31 C26 28, 24 25, 23 22 C25 24, 28 26, 31 31 Z"/>
      <circle cx="21" cy="21" r="3.5" fill="#FFF"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="54" y="27" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#500724" letter-spacing="1.5">MALABAR</text>
  <line x1="55" y1="33" x2="208" y2="33" stroke="url(#mgdGold)" stroke-width="1.2"/>
  <text x="55" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#9D174D" letter-spacing="3">GOLD &amp; DIAMONDS</text>
</svg>