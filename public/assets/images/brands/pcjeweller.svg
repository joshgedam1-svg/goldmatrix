<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" width="210" height="50">
  <defs>
    <linearGradient id="pcBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- PC Interlocking Diamond Monogram -->
  <g transform="translate(6, 5)">
    <rect x="2" y="2" width="36" height="36" rx="6" fill="url(#pcBlue)"/>
    <rect x="4" y="4" width="32" height="32" rx="4" fill="none" stroke="url(#pcGold)" stroke-width="1.2"/>
    <!-- Stylized P & C Letters in Gold -->
    <text x="7" y="27" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="900" fill="url(#pcGold)">P</text>
    <text x="21" y="27" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="900" fill="#FFFFFF">C</text>
  </g>
  <!-- Wordmark -->
  <text x="52" y="26" font-family="'Cinzel', 'Georgia', serif" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="1.2">PC Jeweller</text>
  <line x1="53" y1="32" x2="200" y2="32" stroke="url(#pcGold)" stroke-width="1"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="7" font-weight="800" fill="#1E3A8A" letter-spacing="2.8">JEWELLER FOR GENERATIONS</text>
</svg>