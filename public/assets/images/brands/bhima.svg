<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 50" width="215" height="50">
  <defs>
    <linearGradient id="bhimaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="bhimaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <!-- Bhima Emblem -->
  <g transform="translate(6, 4)">
    <circle cx="21" cy="21" r="19" fill="url(#bhimaBlue)" stroke="url(#bhimaGold)" stroke-width="1.6"/>
    <!-- Traditional Gold Lamp / Diya Emblem -->
