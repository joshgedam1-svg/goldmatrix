  <text x="52" y="27" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="900" fill="#172554" letter-spacing="3">BHIMA</text>
  <line x1="53" y1="33" x2="200" y2="33" stroke="url(#bhimaGold)" stroke-width="1.2"/>
  <text x="54" y="42" font-family="'Montserrat', Arial, sans-serif" font-size="8" font-weight="800" fill="#92400E" letter-spacing="4">JEWELLERS</text>
</svg>
