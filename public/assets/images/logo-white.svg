<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <!-- Dark sidebar background logo (light text on dark) -->

  <!-- Diamond Gem Icon -->
  <polygon points="32,4 50,22 32,60 14,22" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="32,4 50,22 32,34 14,22" fill="#C9A84C" opacity="0.25"/>
  <polygon points="14,22 32,34 32,60" fill="#C9A84C" opacity="0.12"/>
  <polygon points="50,22 32,34 32,60" fill="#C9A84C" opacity="0.30"/>
  <line x1="14" y1="22" x2="50" y2="22" stroke="#C9A84C" stroke-width="1.5"/>
  <line x1="32" y1="4" x2="32" y2="34" stroke="#C9A84C" stroke-width="1" opacity="0.55"/>
  <circle cx="32" cy="34" r="2.2" fill="#C9A84C"/>

  <!-- Company Name: white for dark bg -->
  <text
    x="68" y="34"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="22"
    letter-spacing="-0.5"
    fill="#FFFFFF">GoldMatrix</text>

  <!-- Tagline: gold accent -->
  <text
    x="69" y="50"
    font-family="Inter, Arial, sans-serif"
    font-weight="600"
    font-size="9"
    letter-spacing="2.5"
    fill="#C9A84C">ERP SOFTWARE</text>
</svg>
