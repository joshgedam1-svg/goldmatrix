<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
    </style>
  </defs>

  <!-- Diamond Gem Icon — Dark navy for white/light backgrounds -->
  <polygon points="32,4 50,22 32,60 14,22" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Top facet fill -->
  <polygon points="32,4 50,22 32,34 14,22" fill="#0B1F3A" opacity="0.15"/>
  <!-- Bottom left facet -->
  <polygon points="14,22 32,34 32,60" fill="#0B1F3A" opacity="0.08"/>
  <!-- Bottom right facet -->
  <polygon points="50,22 32,34 32,60" fill="#0B1F3A" opacity="0.20"/>
  <!-- Center girdle line -->
  <line x1="14" y1="22" x2="50" y2="22" stroke="#0B1F3A" stroke-width="1.5"/>
  <!-- Top vertical facet line -->
  <line x1="32" y1="4" x2="32" y2="34" stroke="#0B1F3A" stroke-width="1" opacity="0.5"/>
  <!-- Center dot (table) — gold accent -->
  <circle cx="32" cy="34" r="2.5" fill="#C9A84C"/>

  <!-- Company Name: GoldMatrix -->
  <text
    x="68" y="34"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    font-size="22"
    letter-spacing="-0.5"
    fill="#0B1F3A">GoldMatrix</text>

  <!-- Tagline: ERP SOFTWARE -->
  <text
    x="69" y="50"
    font-family="Inter, Arial, sans-serif"
    font-weight="600"
    font-size="9"
    letter-spacing="2.5"
    fill="#C9A84C">ERP SOFTWARE</text>
</svg>
