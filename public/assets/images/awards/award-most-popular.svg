<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <filter id="shadow5" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueBanner5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Hexagon Outer -->
  <polygon points="120,20 206,65 206,176 120,222 34,176 34,65" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#shadow5)"/>

  <!-- Inner Dotted Hexagon -->
  <polygon points="120,28 196,70 196,170 120,212 44,170 44,70" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- Stars -->
  <g transform="translate(120, 50)" fill="url(#goldGrad5)">
    <polygon points="-24,2 -20,-1 -16,2 -18,-3 -14,-6 -19,-6 -21,-11 -23,-6 -28,-6 -24,-3" transform="scale(0.85) translate(4, 0)"/>
    <polygon points="0,3 4,0 8,3 6,-3 10,-7 5,-7 3,-13 1,-7 -4,-7 0,-3" transform="scale(0.95) translate(120, -4)"/>
    <polygon points="24,2 28,-1 32,2 30,-3 34,-6 29,-6 27,-11 25,-6 20,-6 24,-3" transform="scale(0.85) translate(235, 0)"/>
  </g>

  <!-- MOST POPULAR Heading -->
  <text x="120" y="86" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#0C4A6E" text-anchor="middle" letter-spacing="1.5">MOST</text>
  <text x="120" y="105" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#0C4A6E" text-anchor="middle" letter-spacing="1.5">POPULAR</text>

  <!-- Banner Ribbon Tails -->
  <path d="M 20 135 L 5 150 L 20 165 L 35 150 Z" fill="#0369A1"/>
  <path d="M 220 135 L 235 150 L 220 165 L 205 150 Z" fill="#0369A1"/>

  <!-- Blue Banner -->
  <rect x="18" y="132" width="204" height="38" rx="4" fill="url(#blueBanner5)"/>
  <rect x="21" y="135" width="198" height="32" rx="2" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>

  <!-- SoftwareSuggest Clean Brand on Banner -->
  <text x="120" y="156" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
    Software<tspan font-weight="900" fill="#E0F2FE">Suggest</tspan>
  </text>

  <!-- Fall 2020 -->
  <text x="120" y="196" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="0.8">— Fall 2020 —</text>
</svg>
