<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Ribbon Tails -->
  <path d="M 45 190 L 30 235 L 55 220 L 75 235 L 65 190 Z" fill="#0C4A6E"/>
  <path d="M 195 190 L 210 235 L 185 220 L 165 235 L 175 190 Z" fill="#0C4A6E"/>
  <path d="M 52 195 L 42 228 L 60 216 L 72 225 L 66 195 Z" fill="#0284C7"/>
  <path d="M 188 195 L 198 228 L 180 216 L 168 225 L 174 195 Z" fill="#0284C7"/>

  <!-- Main Shield Outer -->
  <path d="M 120 18 C 175 18 205 32 205 78 C 205 142 165 190 120 208 C 75 190 35 142 35 78 C 35 32 65 18 120 18 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="3.5" filter="url(#shadow2)"/>

  <!-- Inner Gold Dotted Border -->
  <path d="M 120 26 C 168 26 195 38 195 78 C 195 135 160 178 120 196 C 80 178 45 135 45 78 C 45 38 72 26 120 26 Z" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="3,2"/>

  <!-- Crown Icon -->
  <g transform="translate(120, 44) scale(0.9)">
    <path d="M -16 6 L -10 -4 L 0 2 L 10 -4 L 16 6 Z" fill="url(#goldGrad2)"/>
    <circle cx="-10" cy="-6" r="1.5" fill="#D97706"/>
    <circle cx="0" cy="0" r="1.5" fill="#D97706"/>
    <circle cx="10" cy="-6" r="1.5" fill="#D97706"/>
  </g>

  <!-- SoftwareSuggest Text -->
  <text x="120" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0369A1" text-anchor="middle" letter-spacing="0.4">
    Software<tspan font-size="9" font-weight="900" dy="-4">®</tspan><tspan font-size="14" font-weight="800" dy="4">UGGEST</tspan>
  </text>

  <!-- Main Banner Badge -->
  <g transform="translate(0, 88)">
    <rect x="26" y="8" width="188" height="42" rx="4" fill="#0369A1"/>
    <rect x="29" y="11" width="182" height="36" rx="2" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="120" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">Customers Choice</text>
  </g>

  <!-- Season & Year -->
  <text x="120" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="1.5">SUMMER</text>
  <text x="120" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">2022</text>
  <line x1="75" y1="175" x2="95" y2="175" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="145" y1="175" x2="165" y2="175" stroke="#CBD5E1" stroke-width="1.2"/>
</svg>
