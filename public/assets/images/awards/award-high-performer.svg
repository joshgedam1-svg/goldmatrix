<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Ribbon Tails -->
  <path d="M 45 190 L 28 238 L 56 222 L 78 238 L 66 190 Z" fill="#0369A1"/>
  <path d="M 195 190 L 212 238 L 184 222 L 162 238 L 174 190 Z" fill="#0369A1"/>
  <path d="M 52 195 L 38 232 L 58 220 L 72 230 L 66 195 Z" fill="#0284C7"/>
  <path d="M 188 195 L 202 232 L 182 220 L 168 230 L 174 195 Z" fill="#0284C7"/>

  <!-- Main Shield Outer -->
  <path d="M 120 18 C 176 18 206 32 206 80 C 206 144 165 192 120 210 C 75 192 34 144 34 80 C 34 32 64 18 120 18 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#shadow)"/>

  <!-- Inner Gold Dotted Border -->
  <path d="M 120 26 C 168 26 196 38 196 80 C 196 136 160 180 120 198 C 80 180 44 136 44 80 C 44 38 72 26 120 26 Z" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- Gold Crown / Stars Icon -->
  <g transform="translate(120, 42)">
    <path d="M -14 5 L -9 -3 L 0 2 L 9 -3 L 14 5 Z" fill="url(#goldGrad)"/>
    <circle cx="-9" cy="-5" r="1.5" fill="#D97706"/>
    <circle cx="0" cy="0" r="1.5" fill="#D97706"/>
    <circle cx="9" cy="-5" r="1.5" fill="#D97706"/>
  </g>

  <!-- SoftwareSuggest Clean Brand Logo -->
  <g transform="translate(120, 68)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0369A1" text-anchor="middle" letter-spacing="0.3">
      Software<tspan font-weight="900" fill="#0284C7">Suggest</tspan>
    </text>
  </g>

  <!-- Main Banner Badge -->
  <g transform="translate(0, 86)">
    <rect x="26" y="8" width="188" height="42" rx="5" fill="url(#blueBanner)"/>
    <rect x="29" y="11" width="182" height="36" rx="3" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="120" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">High Performer</text>
  </g>

  <!-- Season & Year -->
  <text x="120" y="160" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="1.8">WINTER</text>
  <text x="120" y="180" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">2023</text>
  <line x1="75" y1="175" x2="95" y2="175" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="145" y1="175" x2="165" y2="175" stroke="#CBD5E1" stroke-width="1.2"/>
</svg>
